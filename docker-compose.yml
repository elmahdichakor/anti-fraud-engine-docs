version: '3.8'

services:
  # Main Anti-Fraud Service (Go Core + ML Hybrid Engine)
  app:
    image: elmahdichakor/anti-fraud-system:17.0.0
    container_name: anti_fraud_app
    restart: always
    ports:
      - "8080:8080"   # Core API & Dashboard
      - "5001:5001"   # ML Service (Detection)
      - "5002:5002"   # ML Service (Behavioral)
      - "5003:5003"   # ML Service (Data Pipeline)
    environment:
      - APP_ENV=production
      - PORT=8080
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - NEO4J_ENABLED=true
      - ZERO_TRUST_ENABLED=true
      - QUANTUM_SAFE_ENABLED=true
    depends_on:
      - redis
    networks:
      - anti_fraud_network

  # Caching Layer & Rate Limiting Engine
  redis:
    image: redis:7-alpine
    container_name: anti_fraud_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - anti_fraud_network

  # Optional Graph Database for Fraud Ring Detection
  neo4j:
    image: neo4j:5-community
    container_name: anti_fraud_neo4j
    profiles:
      - full
    ports:
      - "7474:7474"   # HTTP Browser
      - "7687:7687"   # Bolt
    environment:
      - NEO4J_AUTH=neo4j/anti_fraud_secure_password
    volumes:
      - neo4j_data:/data
    networks:
      - anti_fraud_network

networks:
  anti_fraud_network:
    driver: bridge

volumes:
  redis_data:
  neo4j_data:
